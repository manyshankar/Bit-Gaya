<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contect With Manushankar</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
    body{
font-family:Arial, sans-serif;
background:#f4f6f9;
margin:0;
padding:0;
}



.contact-section{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:40px 15px;
}



.contact-container{
display:flex;
max-width:1000px;
width:100%;
background:white;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
overflow:hidden;
}

/* PROFILE */

.profile{
width:35%;
background:#0d6efd;
color:white;
padding:30px;
text-align:center;
}

.profile img{
width:130px;
height:130px;
border-radius:50%;
object-fit:cover;
margin-bottom:15px;
border:4px solid white;
}

.profile h2{
margin:10px 0;
}

.profile p{
font-size:14px;
}

/* SOCIAL */

.social{
margin-top:20px;
}

.social a{
color:white;
font-size:18px;
margin:8px;
display:inline-block;
transition:0.3s;
}

.social a:hover{
transform:scale(1.2);
color:#ffd700;
}



.contact-form{
width:65%;
padding:35px;
}

.contact-form h2{
margin-bottom:20px;
}

.contact-form input,
.contact-form textarea{
width:100%;
padding:12px;
margin-bottom:15px;
border-radius:8px;
border:1px solid #ccc;
font-size:14px;
}

.contact-form textarea{
height:120px;
resize:none;
}

.contact-form button{
width:100%;
padding:12px;
border:none;
background:#0d6efd;
color:white;
font-size:16px;
border-radius:25px;
cursor:pointer;
}

.contact-form button:hover{
background:#084298;
}


@media (max-width:900px){

.contact-container{
flex-direction:column;
}

.profile{
width:100%;
}

.contact-form{
width:100%;
}

}


@media (max-width:480px){

.contact-section{
padding:20px 5px;
}

.profile img{
width:100px;
height:100px;
}

.contact-form{
padding:20px;
}

.contact-form input,
.contact-form textarea{
font-size:13px;
}

.contact-form button{
font-size:14px;
}

}
</style>
</head>

<body>

<section class="contact-section">

<div class="contact-container">

</div>

</div>

</section>
